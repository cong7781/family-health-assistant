#
# 家庭健康助手 · 后端配置
#
# 约定：所有敏感值都写成 ${环境变量:本地默认值} 的形式。
#   - 本地默认值只是为了让别人 clone 下来能直接跑，不要用于任何真实环境；
#   - 部署时通过环境变量覆盖即可，配置文件本身不含任何真实密钥。
#

server.port=${SERVER_PORT:8088}
spring.application.name=familyHealth

# ===== 数据库 =====
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/familyhealthdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis =====
mybatis.type-aliases-package=com.example.familyhealth.model
mybatis.mapper-locations=classpath:mapper/*Mapper.xml
mybatis.configuration.map-underscore-to-camel-case=true
# 开发期把 SQL 打到控制台，方便排查；上线建议改成 org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 安全 =====
# JWT 签名密钥：至少 32 位。部署时务必用 JWT_SECRET 覆盖成一串随机值。
jwt.secret=${JWT_SECRET:familyhealth-local-dev-secret-please-change-me-2026}
# 是否允许库里的「明文存量密码」继续登录（用于平滑迁移）。
# 迁移完成后设为 false，之后任何明文密码都会被直接拒绝。
auth.allow-legacy-plaintext=${ALLOW_LEGACY_PLAINTEXT:true}

# ===== AI 大模型（DeepSeek / 任何 OpenAI 兼容接口）=====
ai.api.url=${AI_API_URL:https://api.deepseek.com/v1/chat/completions}
# 【重要】这里故意留空。真实 Key 只能通过环境变量 AI_API_KEY 提供，
# 永远不要把 sk- 开头的字符串写进这个文件并提交到仓库。
ai.api.key=${AI_API_KEY:}
ai.api.model=${AI_API_MODEL:deepseek-chat}

# ===== 演示数据 =====
# 首次启动时若 member 表为空，自动创建演示账号 demo / 123456
app.demo-account.enabled=${DEMO_ACCOUNT_ENABLED:true}

# ===== 日志 =====
logging.level.com.example.familyhealth=INFO
