server.port = 8088
spring.application.name=familyHealth

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/familyhealthdb?serverTimezone=Asia/Shanghai
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456
#mybatis
mybatis.type-aliases-package=com.example.familyhealth.model
mybatis.mapper-locations = classpath:mapper/*Mapper.xml
mybatis.configuration.map-underscore-to-camel-case = true
mybatis.configuration.cache-enabled= true
mybatis.configuration.log-impl= org.apache.ibatis.logging.stdout.StdOutImpl
# ========== AI大模型配置（DeepSeek / OpenAI兼容接口）==========
ai.api.url=https://api.deepseek.com/v1/chat/completions
ai.api.key=YOUR_KEY_HERE
ai.api.model=deepseek-chat